risks:
  - id: "R-01"
    marker: "[RISK]"
    classification: "unverified"
    statement: "Mutable OW and Gadgetbridge branches can change independently of the contracts."
    mitigation: "Pin clean commits, immutable tags, or image digests before real integration."
  - id: "R-02"
    marker: "[RISK]"
    classification: "persisted_internal"
    statement: "The legacy SQL path can bypass the public API and internal schema compatibility rules."
    mitigation: "Do not use it for Enano Coach; remove or block it only after the API gate in legacy-db-disposition.md."
  - id: "R-03"
    marker: "[RISK]"
    classification: "accepted_not_persisted"
    statement: "SDK input acceptance and internal columns do not prove canonical persistence or public visibility."
    mitigation: "Require authorized response, persistence, correlation, and replay tests against a pinned reference."
  - id: "R-04"
    marker: "[RISK]"
    classification: "unverified"
    statement: "Open sync metadata and error content could leak if the BFF forwards it."
    mitigation: "Keep upstream_observed server-side, emit only BFF_sanitized allowlisted fields, and reject raw_not_public content."
  - id: "R-05"
    marker: "[RISK]"
    classification: "future_contract"
    statement: "A route inferred from generic GPS series could expose sensitive or incorrect geography."
    mitigation: "Keep maps and routes out of the first slice until association, privacy, downsampling, and pagination are contracted."

