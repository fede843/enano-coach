[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enano-coach-bff"
version = "0.1.0"
description = "Fixture-backed FastAPI BFF for the Enano Coach verification slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/bff", "src/adapter"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The fixture adapter contains intentionally long public-documentation strings;
# Black remains the formatter for all Python sources.
"src/adapter/*.py" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]
